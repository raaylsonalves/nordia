<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nordia | Design lab</title>
<style>
@font-face{font-family:Rethink;src:url('/fonts/rethink-sans-semibold.ttf');font-weight:600;font-display:swap}
:root{--raw-canvas:#f0f0f0;--raw-ink:#000;--raw-accent:#f74b01;--canvas:var(--raw-canvas);--ink:var(--raw-ink);--accent:var(--raw-accent);--type:116px;--line:1.0;--gutter:24px;--radius:0}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Rethink,Arial,sans-serif}header{height:68px;padding:24px;font-size:14px}main{max-width:1100px;margin:0 auto}h1{font-size:var(--type);font-weight:600;line-height:var(--line);letter-spacing:-.055em;margin:8px 0 20px}.line{display:block;white-space:nowrap}.line:nth-child(1){padding-left:6%}.line:nth-child(2){padding-left:24%}.line:nth-child(3){padding-left:0}.accent{color:var(--accent)}.media{width:76%;height:420px;margin:0 auto;background:var(--accent);display:grid;place-items:center}.media img{height:180px}p{font:14px Arial,sans-serif;margin:24px}@media(max-width:767px){main{padding:0 16px}h1{font-size:11vw}.media{width:100%;height:280px}}
</style></head><body><header>NORDIA</header><main><h1><span class="line">TECNOLOGIA</span><span class="line">QUE MOVE</span><span class="line">NEGÓCIOS<span class="accent">.</span></span></h1><div class="media"><img src="/brand/nordia-mark.svg" alt="NORDIA"></div><p>Estudo isolado de tipografia, proporção e superfície.</p></main></body></html>
